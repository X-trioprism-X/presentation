<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cognitive Abstraction</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#020617}
canvas{display:block;width:100%;height:100%}
</style>
</head><body><canvas id="c"></canvas>
<script>
(function(){
  function dens(){try{const d=parseInt(localStorage.getItem('backdrop_particle_density')||'60',10);return Math.max(10,Math.min(200,isNaN(d)?60:d));}catch(e){return 60;}}
  window.__bgDensity=dens;
  window.addEventListener('message',function(e){if(e.data&&e.data.type==='setDensity'){try{localStorage.setItem('backdrop_particle_density',String(e.data.value));}catch(x){}window.__bgDensity=dens;if(window.__onDensityChange)window.__onDensityChange();}});
  const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
  let W,H,nodes=[],shapes=[],t=0;
  function resize(){W=canvas.width=innerWidth;H=canvas.height=innerHeight;init();}
  function nCount(){return Math.floor(dens()*1.8);}
  function sCount(){return Math.max(6,Math.floor(dens()*0.35));}
  function init(){
    nodes=Array.from({length:nCount()},()=>({
      x:Math.random()*W,y:Math.random()*H,
      vx:(Math.random()-0.5)*0.7,vy:(Math.random()-0.5)*0.7,
      r:1.2+Math.random()*2.8, hue:250+Math.random()*80
    }));
    shapes=Array.from({length:sCount()},()=>({
      x:Math.random()*W,y:Math.random()*H,
      vx:(Math.random()-0.5)*0.35,vy:(Math.random()-0.5)*0.35,
      w:18+Math.random()*50,h:12+Math.random()*40,
      rot:Math.random()*Math.PI, rv:(Math.random()-0.5)*0.01,
      type:Math.random()>0.5?'rect':'square',
      hue:260+Math.random()*60, alpha:0.08+Math.random()*0.12
    }));
  }
  window.__onDensityChange=init;
  function draw(){
    t+=0.008;
    ctx.fillStyle='rgba(2,6,23,0.14)';ctx.fillRect(0,0,W,H);
    // soft radial glow
    const g=ctx.createRadialGradient(W*0.5,H*0.5,20,W*0.5,H*0.5,Math.max(W,H)*0.6);
    g.addColorStop(0,'rgba(120,60,220,0.06)');g.addColorStop(1,'rgba(2,6,23,0)');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

    // floating shapes
    for(const s of shapes){
      s.x+=s.vx;s.y+=s.vy;s.rot+=s.rv;
      if(s.x<-60)s.x=W+60;if(s.x>W+60)s.x=-60;
      if(s.y<-60)s.y=H+60;if(s.y>H+60)s.y=-60;
      ctx.save();ctx.translate(s.x,s.y);ctx.rotate(s.rot);
      const side=s.type==='square'?s.w:s.w;
      const h=s.type==='square'?s.w:s.h;
      ctx.strokeStyle=`hsla(${s.hue},80%,65%,${s.alpha+0.1})`;
      ctx.fillStyle=`hsla(${s.hue},70%,50%,${s.alpha})`;
      ctx.lineWidth=1.5;
      ctx.shadowBlur=20;ctx.shadowColor=`hsla(${s.hue},90%,60%,0.35)`;
      ctx.strokeRect(-side/2,-h/2,side,h);
      ctx.fillRect(-side/2,-h/2,side,h);
      ctx.restore();
    }
    ctx.shadowBlur=0;

    // nodes + links
    for(const p of nodes){
      p.x+=p.vx;p.y+=p.vy;
      if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;
      // flash
      const flash=0.7+Math.sin(t*3+p.hue)*0.3;
      ctx.beginPath();
      ctx.fillStyle=`hsla(${p.hue},90%,70%,${flash})`;
      ctx.shadowBlur=16;ctx.shadowColor=`hsla(${p.hue},100%,60%,0.7)`;
      ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();
    }
    ctx.shadowBlur=0;
    for(let i=0;i<nodes.length;i++){
      for(let j=i+1;j<nodes.length;j++){
        const dx=nodes[i].x-nodes[j].x,dy=nodes[i].y-nodes[j].y,d=Math.hypot(dx,dy);
        if(d<150){
          const a=(1-d/150)*0.35;
          ctx.strokeStyle=`hsla(${(nodes[i].hue+nodes[j].hue)/2},80%,65%,${a})`;
          ctx.lineWidth=1+Math.sin(t*2+i)*0.5;
          ctx.beginPath();ctx.moveTo(nodes[i].x,nodes[i].y);ctx.lineTo(nodes[j].x,nodes[j].y);ctx.stroke();
        }
      }
    }
    requestAnimationFrame(draw);
  }
  addEventListener('resize',resize);resize();draw();
})();
</script></body></html>
